name: Panel — desplegar SOLO a mano

# 🔴 NINGÚN PUSH DESPLIEGA NADA. Decisión del 2026-08-02 (misma que en el repo del bot).
#
# ANTES: un push a master reconstruía el panel del taller solo. Se quitó por dos razones que se
# pagaron de verdad: (1) se perdía la certeza de qué versión está viva —el 23-jul un despliegue
# automático recreó los contenedores del taller sin que nadie se enterara—, y (2) publicar en
# GitHub y tocar un sistema con clientes eran el mismo acto, así que no se podía respaldar el
# trabajo sin desplegarlo.
#
# AHORA: `git push` solo publica (respaldo y trazabilidad). Para desplegar hay que venir a la
# pestaña "Actions" -> "Run workflow" y elegir el destino a mano
# (o `gh workflow run deploy.yml -f destino=taller`).
#
# ⚠️ El panel NO tiene puerta de verificación automática (ni `tsc` ni `build` en CI). Antes de
# desplegarlo, compilarlo a mano con Docker — y acordarse de `NEXT_PUBLIC_API_URL`, que es
# build-time: sin ella el bundle cae a localhost:8000 y TODO el panel da "Failed to fetch".
#
# Los tokens viven en los "Secrets" del repositorio (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch:
    inputs:
      destino:
        description: '¿Dónde desplegar? "taller" = pruebas. "produccion" = CLIENTES REALES.'
        type: choice
        options:
          - taller
          - produccion
        default: taller

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: TALLER (Hostinger viejo, tu número de pruebas)
        if: ${{ inputs.destino == 'taller' }}
        run: |
          curl -fsS --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_OLD_TOKEN }}" \
            "http://2.25.139.106:8000/api/v1/deploy?uuid=jvlqemh8s225qjftsev7ss8n"

      - name: PRODUCCIÓN (netcup, CLIENTES REALES)
        if: ${{ inputs.destino == 'produccion' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          {
            printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.COOLIFY_NEW_TOKEN }}"
            printf 'url = "http://127.0.0.1:8000/api/v1/deploy?uuid=o1jo590exxeuco5s8j0arisy"\n'
            printf 'fail\nsilent\nshow-error\nconnect-timeout = 20\nmax-time = 120\nretry = 3\nretry-all-errors\nretry-delay = 5\n'
          } | ssh -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 root@152.53.89.118 \
            'curl --config -'
